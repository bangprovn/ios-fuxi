name: fuxi-sys

on:
  workflow_dispatch:
  push:
    branches: [fuxi-sys-1031]

jobs:
  sys:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Host models of the SpringBoard and application libraries
        run: |
          python3 tools/test-fuxi-rates.py
          python3 tools/test-fuxi-apprate.py
      - name: Build FuxiAudio.driver, libfuxi-sb.dylib and libfuxi-app.dylib
        run: bash tools/build-fuxi-sys.sh out/sys
      - uses: actions/upload-artifact@v4
        with:
          name: fuxi-sys
          path: out/sys
