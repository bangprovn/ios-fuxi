name: fuxi-sys

on:
  workflow_dispatch:

jobs:
  sys:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build FuxiAudio.driver and libfuxi-sb.dylib
        run: tools/build-fuxi-sys.sh out/sys
      - uses: actions/upload-artifact@v4
        with:
          name: fuxi-sys
          path: out/sys
